# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

# Scanning advisories (RustSec security vulnerabilities)
[advisories]
ignore = [
    # Transitive dependency via utoipa-gen with no safe upgrade available yet
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained" },
]

# License checks
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

# Crate bans and duplicate checks
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# Source verification
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
