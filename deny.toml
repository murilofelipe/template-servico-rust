# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

# Scanning advisories (RustSec security vulnerabilities)
[advisories]
ignore = [
    # Marvin Attack: potential key recovery through timing sidechannels in rsa 0.9.10.
    # Transitive dependency via sqlx/sha2 ecosystem; no upstream fix currently available.
    { id = "RUSTSEC-2023-0071", reason = "Transitive dependency via sqlx with no upstream fix available yet" },
]

# License checks
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

# Crate bans and duplicate checks
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# Source verification
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
