name: Code Quality and Metrics

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check code formatting
      run: cargo fmt --all -- --check
      
    - name: Check linting (Clippy)
      run: cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Run tests and coverage (Tarpaulin)
      run: |
        cargo install cargo-tarpaulin --version 0.30.0 || true
        cargo tarpaulin --ignore-tests --out Xml

    - name: Setup Node (Para rodar o jscpd)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Checagem de Duplicação (jscpd)
      run: npx --yes jscpd@5.0.14 src --threshold 5
