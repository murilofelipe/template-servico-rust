name: CI/CD - Qualidade, Teste, Build e Deploy

on:
  push:
    branches:
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run formatting check
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests and coverage (Tarpaulin)
        run: |
          cargo install cargo-tarpaulin --version 0.30.0 || true
          cargo tarpaulin --ignore-tests --out Xml

      - name: Setup Node (Para rodar o jscpd)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checagem de Duplicação (jscpd)
        run: npx --yes jscpd@5.0.14 src --threshold 5

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Build da imagem Docker de produção para teste
        run: docker build . --file Dockerfile --tag test-build:latest

  publish-to-registry:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build-test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extrair metadados e tags do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=ref,event=branch,name=develop
            type=sha,prefix=,format=short
      - name: Build e Push da imagem Docker de PRODUÇÃO
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
